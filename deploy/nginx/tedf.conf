## TEDF — nginx reverse proxy cho tedf.io.vn
##
## Cài đặt trên server:
##   sudo cp deploy/nginx/tedf.conf /etc/nginx/conf.d/tedf.conf
##   sudo nginx -t && sudo systemctl reload nginx
##
## File này là HỢP ĐỒNG ĐỊNH TUYẾN giữa SPA và API. Vì SPA build với
## VITE_API_BASE_URL="" (same-origin), mọi path mà backend phục vụ đều PHẢI có
## một location tương ứng ở đây. Path nào thiếu sẽ rơi xuống `location /` và
## nhận về index.html kèm HTTP 200 — client parse HTML thành JSON rồi chết với
## "Unexpected token '<'". Đó chính là cách SignalR realtime hỏng ở production
## trong khi local vẫn chạy (local trỏ thẳng Kestrel, không đi qua nginx).
##
## Backend phục vụ (xem TEDF.API/Program.cs):
##   /api/*     — Minimal API endpoints
##   /health    — health check
##   /hubs/*    — SignalR: /hubs/notifications, /hubs/chat
##   /hangfire  — dashboard job nền (bảo vệ bởi HangfireAuthFilter)
##   /swagger   — CHỈ Development, không expose ở production
##
## Khi thêm prefix mới ở backend: thêm location ở đây VÀ thêm assert vào
## scripts/smoke-test-routing.sh.

# Bắt buộc cho WebSocket. Chỉ request nào thực sự có header Upgrade mới được
# chuyển thành "Connection: upgrade"; request thường (negotiate POST, long-polling)
# nhận "Connection: close". Hardcode `Connection "upgrade"` cho mọi request là
# lỗi hay gặp và làm hỏng chính bước negotiate.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tedf_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream tedf_frontend {
    server 127.0.0.1:5173;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name tedf.io.vn www.tedf.io.vn;

    # Backend không tự redirect http→https ở Production (Program.cs tắt
    # UseHttpsRedirection để tránh vòng lặp redirect sau proxy). nginx làm việc này.
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name tedf.io.vn www.tedf.io.vn;

    # ── TLS ────────────────────────────────────────────────────────────────
    # Giữ nguyên đường dẫn chứng chỉ hiện có trên server bạn. Hai dòng dưới là
    # layout mặc định của certbot — sửa lại nếu bạn dùng chỗ khác.
    ssl_certificate     /etc/letsencrypt/live/tedf.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tedf.io.vn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload đề tài/tài liệu tối đa 50MB (khớp FIREBASE_STORAGE_MAX_FILE_SIZE_BYTES
    # mặc định 52428800). Mặc định của nginx là 1MB và sẽ trả 413.
    client_max_body_size 50m;

    # ── SignalR hubs ───────────────────────────────────────────────────────
    # PHẢI đứng trước `location /`. Đây là location bị thiếu gây lỗi
    # "Failed to complete negotiation with the server".
    location /hubs/ {
        proxy_pass http://tedf_backend;

        # WebSocket upgrade — thiếu 3 dòng này thì SignalR tụt xuống long-polling
        # hoặc không kết nối được.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kết nối realtime sống lâu; mặc định 60s sẽ ngắt và reconnect liên tục.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Bắt buộc cho fallback ServerSentEvents / LongPolling: buffering làm
        # nginx giữ lại message cho tới khi đầy buffer, realtime thành "chậm ngẫu nhiên".
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
    }

    # ── REST API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://tedf_backend;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Health check ───────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://tedf_backend;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        access_log off;
    }

    # ── Hangfire dashboard ─────────────────────────────────────────────────
    # Đã có HangfireAuthFilter phía backend. Cân nhắc thêm allow/deny theo IP
    # ở đây nếu chỉ muốn truy cập từ mạng nội bộ.
    location /hangfire {
        proxy_pass http://tedf_backend;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # ── SPA (mặc định) ─────────────────────────────────────────────────────
    # Container frontend chạy `serve -s dist`: mọi path không khớp file tĩnh đều
    # trả index.html. Đó là hành vi đúng cho client-side routing, nhưng cũng là
    # lý do path backend bị thiếu sẽ hỏng một cách IM LẶNG (HTTP 200 + HTML)
    # thay vì 404. Giữ location này ở cuối cùng.
    location / {
        proxy_pass http://tedf_frontend;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
