name: Build and Deploy tedf

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tedf-production-deploy
  cancel-in-progress: true

env:
  BACKEND_IMAGE: truongnhat2102/tedf-backend
  FRONTEND_IMAGE: truongnhat2102/tedf-frontend

jobs:
  build-and-deploy:
    name: Build Linux images and deploy
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # ENABLE MULTI-ARCHITECTURE BUILD
      # Hỗ trợ linux/amd64 và linux/arm64
      # =====================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # LOGIN DOCKER HUB
      # =====================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =====================================================
      # BUILD AND PUSH BACKEND
      # =====================================================
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile

          # Hỗ trợ Ubuntu server Intel/AMD và ARM
          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=TEDF Backend
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

          cache-from: type=gha,scope=tedf-backend
          cache-to: type=gha,mode=max,scope=tedf-backend

      # =====================================================
      # BUILD AND PUSH FRONTEND
      # =====================================================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_ENABLE_EMULATOR_LOGIN=false

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=tedf Frontend
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

          cache-from: type=gha,scope=tedf-frontend
          cache-to: type=gha,mode=max,scope=tedf-frontend

      # =====================================================
      # DEPLOY TO UBUNTU VPS
      # =====================================================
      - name: Deploy to Ubuntu VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/home/tedf/tedf"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Không tìm thấy thư mục $PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            if [ -d .git ]; then
              echo "Cập nhật source trên server..."
              git fetch --prune origin
              git checkout dev
              git reset --hard origin/dev
            fi

            echo "Đăng nhập Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            echo "Kiểm tra cấu hình Docker Compose..."
            docker compose config --quiet

            echo "Tải image mới..."
            docker compose pull backend frontend

            echo "Khởi tạo các service nền..."
            docker compose up -d sqlserver mongodb redis clamav

            echo "Chạy service tạo hoặc cập nhật database..."
            docker compose up --force-recreate sqlserver-init

            echo "Khởi động backend và frontend..."
            docker compose up -d \
              --no-build \
              --remove-orphans \
              backend frontend

            echo "Kiểm tra trạng thái container..."
            docker compose ps

            echo "Hiển thị log backend gần nhất..."
            docker compose logs --tail=50 backend

            echo "Đăng xuất Docker Hub..."
            docker logout
