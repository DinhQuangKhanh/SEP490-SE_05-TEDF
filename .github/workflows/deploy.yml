name: Build and Deploy tedf

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Linux images and deploy
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # ENABLE MULTI-ARCHITECTURE BUILD
      # Hỗ trợ linux/amd64 và linux/arm64
      # =====================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # LOGIN DOCKER HUB
      # =====================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =====================================================
      # BUILD AND PUSH BACKEND
      # =====================================================
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile

          # Hỗ trợ Ubuntu server Intel/AMD và ARM
          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=TEDF Backend
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

          cache-from: type=gha,scope=tedf-backend
          cache-to: type=gha,mode=max,scope=tedf-backend

      # =====================================================
      # BUILD AND PUSH FRONTEND
      # =====================================================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_ENABLE_EMULATOR_LOGIN=false

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=tedf Frontend
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

          cache-from: type=gha,scope=tedf-frontend
          cache-to: type=gha,mode=max,scope=tedf-frontend

      # =====================================================
      # DEPLOY TO UBUNTU VPS
      # =====================================================
      - name: Deploy to Ubuntu VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            cd /home/tedf
            docker compose pull
            docker compose up -d