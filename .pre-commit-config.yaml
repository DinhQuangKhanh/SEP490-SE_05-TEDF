# ==================================================
#
# PRE-COMMIT HOOKS — TEDF monorepo
#
# Framework: https://pre-commit.com
#
# One-time setup:
#   pip install pre-commit
#   pre-commit install            # installs both the commit + pre-push hooks
#                                 # (see default_install_hook_types below)
#
# Run manually:
#   pre-commit run --all-files
#
# Local hooks use `language: system`:
#   - dotnet format / eslint  -> need the .NET 8 SDK and frontend node_modules
#   - the guard scripts under scripts/hooks/ -> need `bash` on PATH
#     (Git for Windows provides it; always present on Linux/macOS CI)
#
# ==================================================

# Make `pre-commit install` wire up the pre-push hook too, so
# prevent-push-to-main actually runs on `git push`.
default_install_hook_types: [pre-commit, pre-push]

# Don't run hooks against generated / vendored output.
exclude: |
  (?x)^(
    backend/.*/(bin|obj)/.*|
    frontend/(node_modules|dist|\.vite)/.*|
    .*\.min\.(js|css)
  )$

repos:
  # --------------------------------------------------
  # General-purpose hygiene
  # --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        exclude: ^.*tsconfig.*\.json$ # tsconfig files allow comments (JSONC)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key # content scan: block committing private keys

  # --------------------------------------------------
  # Security / policy guards (scripts/hooks/*.sh)
  # --------------------------------------------------
  - repo: local
    hooks:
      # Refuse to commit secret/credential files (safety net over .gitignore).
      - id: block-sensitive-files
        name: block sensitive files
        entry: bash scripts/hooks/block-sensitive-files.sh
        language: system
        # staged file paths are passed as args to the script

      # Refuse to push to a protected branch (main/master).
      - id: prevent-push-to-main
        name: prevent push to protected branch
        entry: bash scripts/hooks/prevent-push-to-main.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
